name: QA bot
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import
        run: godot --headless --import || true
      - name: Perfect aim (every level must be passable)
        run: godot --headless --fixed-fps 60 -s res://tools/bot.gd -- --levels=1-15 --error=0
      - name: Human-like aim (report only)
        run: godot --headless --fixed-fps 60 -s res://tools/bot.gd -- --levels=1-15 --error=0.5
