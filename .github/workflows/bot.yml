name: QA bot
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import
        run: godot --headless --import || true
      - name: Perfect aim (every level must be passable)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --fixed-fps 60 -s res://tools/bot.gd -- --levels=1-15 --error=0 2>&1 | tee bot0.txt
      - name: Annotate perfect-aim results
        if: always()
        shell: bash
        run: echo "::notice title=Perfect aim::$(grep -E 'LEVEL|BOT DONE|ERROR' bot0.txt | tr '\n' '|' | head -c 3000)"
      - name: Human-like aim (report only)
        shell: bash
        run: |
          godot --headless --fixed-fps 60 -s res://tools/bot.gd -- --levels=1-15 --error=0.5 2>&1 | tee bot5.txt
          echo "::notice title=Human aim::$(grep -E 'LEVEL|BOT DONE|ERROR' bot5.txt | tr '\n' '|' | head -c 3000)"
