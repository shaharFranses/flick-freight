name: QA bot
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import
        run: godot --headless --import || true
      - name: Layout (no truck drives through an obstacle or pad)
        run: godot --headless -s res://tools/layout_check.gd
      - name: Cab test (cargo that stays on the cab is a quick miss)
        run: godot --headless --fixed-fps 60 -s res://tools/cab_test.gd
      - name: Frozen data (levels 1-40 unchanged)
        run: godot --headless -s res://tools/frozen_check.gd
      - name: Parity, levels 1-40 (one level per process, results and throws vs the pre-Plan-2 snapshot)
        shell: bash
        run: tools/parity.sh check 2>&1 | tee parity.txt
      - name: Save compatibility
        run: godot --headless -s res://tools/save_test.gd
      - name: All levels, perfect aim (every level must be passable)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --fixed-fps 60 -s res://tools/bot.gd -- --levels=all --error=0 2>&1 | tee bot0.txt
      - name: All levels, human aim
        shell: bash
        run: |
          set -o pipefail
          godot --headless --fixed-fps 60 -s res://tools/bot.gd -- --levels=all --error=0.5 2>&1 | tee bot5.txt
      - name: Annotate results
        if: always()
        shell: bash
        run: |
          for f in parity bot0 bot5; do
            [ -f $f.txt ] && echo "::notice title=$f::$(grep -E 'LEVEL|BOT DONE|REGRESS|PARITY|SCRIPT ERROR|WARNING: level' $f.txt | tr '\n' '|' | head -c 3500)"
          done
          true
      - name: Web export builds
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable || true
          mkdir -p build
          godot --headless --export-release "Web" build/index.html
          test -f build/index.html && test -f build/index.pck
