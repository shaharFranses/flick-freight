name: Deploy web build to GitHub Pages
on:
  push:
    branches: [main]
  # A push to staging runs "Staging push" (staging-push.yml), which then
  # triggers this workflow on main's ref, so the github-pages environment
  # (main-only deploys) still accepts the deployment.
  workflow_run:
    workflows: ["Staging push"]
    types: [completed]
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      # The site root is always main's build. staging's build is published
      # under /staging/ so it can be played without touching main's URL.
      - name: Check out main (site root)
        id: main_co
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Check out staging (published under /staging/)
        id: staging_co
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable || true
      - name: Export Web (single-threaded)
        working-directory: main
        run: |
          mkdir -p build
          godot --headless --verbose --import || true
          godot --headless --verbose --export-release "Web" build/index.html
          touch build/.nojekyll
      - name: CrazyGames size and file-count check
        shell: bash
        working-directory: main
        run: |
          cd build
          files=$(find . -type f ! -name .nojekyll | sort)
          count=$(echo "$files" | wc -l)
          bytes=$(echo "$files" | xargs stat -c %s | awk '{ s += $1 } END { print s }')
          mb=$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')
          {
            echo "## CrazyGames build"
            echo ""
            echo "**Total:** $mb MB in $count files (excluding .nojekyll)"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in $files; do
              echo "| ${f#./} | $(awk -v b="$(stat -c %s "$f")" 'BEGIN { printf "%.2f MB", b / 1048576 }') |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Total $mb MB, $count files"
          fail=0
          if awk -v m="$mb" 'BEGIN { exit !(m > 50) }'; then
            echo "::error title=CrazyGames::build is $mb MB, over the 50 MB initial-download limit"
            printf "\n**Over the 50 MB limit.**\n" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          elif awk -v m="$mb" 'BEGIN { exit !(m > 20) }'; then
            echo "::warning title=CrazyGames::build is $mb MB, over 20 MB (not eligible for the mobile homepage)"
            printf "\n**Warning:** over 20 MB, not eligible for the CrazyGames mobile homepage.\n" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$count" -gt 1500 ]; then
            echo "::error title=CrazyGames::$count files, over the 1500 file limit"
            fail=1
          fi
          exit $fail
      - name: Upload CrazyGames build (zip of build/ contents)
        uses: actions/upload-artifact@v4
        with:
          name: flick-freight-crazygames-${{ steps.main_co.outputs.commit }}
          path: |
            main/build/
            !main/build/.nojekyll
          if-no-files-found: error
          retention-days: 30
      # Standalone build (no CrazyGames SDK, own analytics: docs/ANALYTICS.md). Skipped on a
      # branch whose export_presets.cfg does not have the preset yet.
      - name: Export Web Standalone
        id: main_standalone
        shell: bash
        working-directory: main
        run: |
          if grep -q 'name="Web Standalone"' export_presets.cfg; then
            mkdir -p build_standalone
            godot --headless --verbose --export-release "Web Standalone" build_standalone/index.html
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Web Standalone preset on main yet." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload standalone build
        if: steps.main_standalone.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flick-freight-standalone-${{ steps.main_co.outputs.commit }}
          path: main/build_standalone/
          if-no-files-found: error
          retention-days: 30
      - name: Export staging Web (single-threaded)
        if: steps.staging_co.outcome == 'success'
        shell: bash
        working-directory: staging
        run: |
          mkdir -p build
          godot --headless --verbose --import || true
          godot --headless --verbose --export-release "Web" build/index.html
          if grep -q 'name="Web Standalone"' export_presets.cfg; then
            mkdir -p build_standalone
            godot --headless --verbose --export-release "Web Standalone" build_standalone/index.html
          fi
      - name: Assemble site (main at root, staging under /staging/)
        shell: bash
        run: |
          mkdir -p site
          cp -a main/build/. site/
          if [ "${{ steps.staging_co.outcome }}" = "success" ]; then
            mkdir -p site/staging
            cp -a staging/build/. site/staging/
            rm -f site/staging/.nojekyll
            if [ -d staging/build_standalone ]; then
              mkdir -p site/staging/standalone
              cp -a staging/build_standalone/. site/staging/standalone/
              echo "staging standalone build published at /staging/standalone/" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "staging ${{ steps.staging_co.outputs.commit }} published at /staging/" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No staging branch: only main is published." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "main ${{ steps.main_co.outputs.commit }} published at /" >> "$GITHUB_STEP_SUMMARY"
          ls -la site site/staging 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
